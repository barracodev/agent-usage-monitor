<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Agent Usage Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="widget" aria-label="Uso de asistentes de IA">
    <button id="toggle" class="toggle" aria-label="Mostrar detalle de uso" aria-expanded="false" aria-controls="providers footer"></button>
    <section id="providers" aria-live="polite"></section>
    <section id="empty-state" class="empty-state" hidden>
      <span id="empty-icon" aria-hidden="true"></span>
      <span><strong>Sin IA visibles</strong><small>Abre ajustes</small></span>
    </section>
    <footer id="footer" class="footer">
      <span id="footer-status"></span>
      <button id="settings" class="settings" aria-label="Configurar proveedores" aria-expanded="false" aria-controls="settings-menu"></button>
    </footer>
    <div id="settings-menu" class="settings-menu" role="group" aria-labelledby="settings-title" hidden>
      <h2 id="settings-title">Mostrar IA</h2>
      <div id="provider-settings"></div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
